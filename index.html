<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge Pet 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading">Carregando Forge Pet 3D...</div>

  <main class="game-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">FORGE STUDIOS</span>
        <h1>Forge Pet <span>3D</span></h1>
      </div>
      <div class="currency">🪙 <strong id="coins">100</strong></div>
    </header>

    <section class="hud">
      <div class="stat"><span>🍗 Fome</span><div class="bar"><i id="hungerBar"></i></div><b id="hungerText">80%</b></div>
      <div class="stat"><span>😊 Felicidade</span><div class="bar"><i id="happyBar"></i></div><b id="happyText">80%</b></div>
      <div class="stat"><span>⚡ Energia</span><div class="bar"><i id="energyBar"></i></div><b id="energyText">80%</b></div>
      <div class="stat"><span>🧼 Higiene</span><div class="bar"><i id="cleanBar"></i></div><b id="cleanText">80%</b></div>
    </section>

    <section class="scene-wrap">
      <div id="scene"></div>
      <div class="hint">Arraste para girar a câmera • Use os botões para interagir</div>
      <div id="message" class="message">Olá! Eu sou seu Forge Pet 🐰</div>
    </section>

    <section class="controls">
      <button data-action="feed">🥕 Alimentar</button>
      <button data-action="play">🎾 Brincar</button>
      <button data-action="sleep">😴 Dormir</button>
      <button data-action="bath">🛁 Banho</button>
      <button data-action="pet">❤️ Carinho</button>
    </section>

    <section class="food-panel">
      <h2>Comidas</h2>
      <div class="foods">
        <button class="food" data-food="🥕" data-value="12">🥕<small>Cenoura</small></button>
        <button class="food" data-food="🍎" data-value="10">🍎<small>Maçã</small></button>
        <button class="food" data-food="🍓" data-value="8">🍓<small>Morango</small></button>
      </div>
      <p>Escolha uma comida para o coelho comer.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
